<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫宮のアトリエwith猫宮の街</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<header class="sticky-header">
    <a href="Home" class="site-logo" id="siteLogo">
        <img src="images/icons/logo.png" alt="猫宮のアトリエwith猫宮の街" class="logo-img">
    </a>
    <div class="header-actions">
        <button class="btn btn-theme" id="themeToggle" title="テーマ切り替え">🌙</button>
        <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<nav class="side-menu" id="sideMenu">
    <ul id="menuList"></ul>
</nav>
<div class="menu-overlay" id="menuOverlay"></div>

<main class="main-content error-page">
    <div class="error-container">
        <h1 id="errorCode">404</h1>
        <h2 id="errorTitle">Not Found</h2>
        <p id="errorMessage">お探しのページは見つかりませんでした。</p>
        <a href="/" class="btn btn-home">ホームに戻る</a>
    </div>
</main>

<button class="btn btn-link-share" id="linkShareBtn" title="ページの URL を共有">🔗</button>

<div id="toast" class="toast"></div>

<script src="js/base.js"></script>
<script>
    // URL パラメータからエラーコードを取得
    const urlParams = new URLSearchParams(window.location.search);
    const errorCode = urlParams.get('error') || '404';
    
    const errorCodeEl = document.getElementById('errorCode');
    const errorTitleEl = document.getElementById('errorTitle');
    const errorMessageEl = document.getElementById('errorMessage');
    
    if (errorCode === '503') {
        errorCodeEl.textContent = '503';
        errorTitleEl.textContent = 'Service Unavailable';
        errorMessageEl.textContent = 'このページは現在準備中です。';
    } else {
        errorCodeEl.textContent = '404';
        errorTitleEl.textContent = 'Not Found';
        errorMessageEl.textContent = 'お探しのページは見つかりませんでした。';
    }
</script>
</body>
</html>
